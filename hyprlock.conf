# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
}


# =====================================================
# Background
# =====================================================

background {
    monitor =
    path = screenshot

    blur_passes = 6
    blur_size = 12

    noise = 0.015
    contrast = 1.15
    brightness = 0.75
    vibrancy = 0.20
}

# =====================================================
# 24-Hour Clock with Seconds
# =====================================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"

    color = rgba(ffffffff)

    font_size = 110
    font_family = JetBrainsMono Nerd Font

    position = 0, 180
    halign = center
    valign = center
}

# =====================================================
# Date
# =====================================================

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"

    color = rgba(ffffffaa)

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 90
    halign = center
    valign = center
}

# =====================================================
# User
# =====================================================

label {
    monitor =
    text =   $USER

    color = rgba(ffffffff)

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, -50
    halign = center
    valign = center
}

# =====================================================
# Capsule Password Field
# =====================================================

input-field {
    monitor =

    size = 450, 70

    outline_thickness = 0
    rounding = 35

    outer_color = rgba(00000000)
    inner_color = rgba(1e1e2ecc)

    font_color = rgba(ffffffff)

    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)

    fail_text = Authentication failed

    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.30

    fade_on_empty = false

    placeholder_text = Enter Password
    placeholder_text_color = rgba(ffffff88)

    position = 0, -140
    halign = center
    valign = center
}

# =====================================================
# Hostname
# =====================================================

label {
    monitor =
    text = cmd[update:5000] echo "$(hostname)"

    color = rgba(ffffff88)

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, -240
    halign = center
    valign = center
}

# =====================================================
# Bottom Hint
# =====================================================

label {
    monitor =
    text = Press Enter to Unlock

    color = rgba(ffffffaa)

    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -330
    halign = center
    valign = center
}

